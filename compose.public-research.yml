name: prospect-cockpit-public-research

services:
  searxng:
    image: searxng/searxng:2026.7.28-c01178d03@sha256:5d6d903ab82afa56ee32792d477f36bc63d3e5ca04fcb6947e28a5cfd987fad3
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SEARXNG_PORT:-8080}:8080"
    volumes:
      - ./infrastructure/searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      SEARXNG_BASE_URL: http://localhost:${SEARXNG_PORT:-8080}/
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp, /var/cache/searxng]
    healthcheck:
      test:
        [
          CMD-SHELL,
          "wget -q -O /dev/null 'http://127.0.0.1:8080/healthz' || exit 1",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    networks: [public-research]

  extraction-worker:
    build:
      context: ./workers/public-extraction
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PUBLIC_EXTRACTION_PORT:-8787}:8787"
    environment:
      PUBLIC_EXTRACTION_ALLOWED_HOSTS: ${PUBLIC_EXTRACTION_ALLOWED_HOSTS:?set approved public hosts}
      PUBLIC_RESEARCH_USER_AGENT: ${PUBLIC_RESEARCH_USER_AGENT:-ProspectIntelligenceCockpit/0.1}
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    shm_size: 256mb
    healthcheck:
      test:
        [
          CMD,
          python,
          -c,
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/healthz', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    networks: [public-research]

networks:
  public-research:
    internal: false
