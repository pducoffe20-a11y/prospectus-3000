<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="t d"><title id="t">Mobile prospect detail concept</title><desc id="d">Static product design concept for review; all prospect data is fictional.</desc><style>text{font-family:Inter,Arial,sans-serif;fill:#17242C}.muted{fill:#68757C}.white{fill:#fff}.tiny{font-size:11px}.small{font-size:13px}.body{font-size:14px}.label{font-size:12px;font-weight:700;letter-spacing:.8px}.h1{font-size:25px;font-weight:750}.h2{font-size:17px;font-weight:700}.num{font-size:22px;font-weight:750}.serif{font-family:Georgia,serif}.bold{font-weight:700}</style><rect width="100%" height="100%" fill="#F4F3EF"/><rect width="390" height="66" fill="#17242C"/><text x="20" y="39" class="white h2">‹</text><text x="50" y="34" class="white body bold">Prospect detail</text><text x="20" y="100" class="label" fill="#166B55">WORK NOW · SCORE 84</text><text x="20" y="136" class="h1">Maya Chen</text><text x="20" y="160" class="small muted">VP, Credentialing · National Credentialing Forum</text><rect x="20" y="184" width="350" height="112" rx="10" fill="white"/><text x="38" y="212" class="label muted">WHY TODAY</text><text x="38" y="241" class="serif body">A verified certification launch creates a</text><text x="38" y="264" class="serif body">timely external-learner conversation.</text><text x="38" y="286" class="tiny" fill="#00A6A6">View reasoning trace →</text><text x="20" y="334" class="h2">Evidence</text><rect x="20" y="350" width="350" height="84" rx="8" fill="#EDF7F1"/><text x="38" y="378" class="label" fill="#166B55">✓ VERIFIED FACT</text><text x="38" y="404" class="small bold">New credential pathway launches this fall.</text><text x="38" y="424" class="tiny muted">Announcement · Jun 18 ↗</text><rect x="20" y="446" width="350" height="84" rx="8" fill="#F2F0F8"/><text x="38" y="474" class="label" fill="#6C648B">◇ INFERENCE · 76%</text><text x="38" y="500" class="small bold">Enrollment operations may be scaling.</text><text x="38" y="520" class="tiny muted">Hypothesis only · 2 supporting claims</text><text x="20" y="568" class="h2">Outreach review</text><rect x="20" y="584" width="350" height="116" rx="10" fill="white"/><text x="38" y="612" class="label" fill="#B56B13">NEEDS REVIEW</text><text x="38" y="641" class="small">Email · 83 words · soft question</text><text x="38" y="665" class="tiny" fill="#B84D44">1 fact-check target</text><text x="38" y="688" class="tiny" fill="#00A6A6">Open draft and review →</text><rect x="0" y="758" width="390" height="86" fill="white"/><line x1="0" y1="758" x2="390" y2="758" stroke="#DCE2E2"/><rect x="20" y="776" width="110" height="48" rx="7" fill="#166B55"/><text x="45" y="806" class="white small bold">Mark Sent</text><rect x="140" y="776" width="110" height="48" rx="7" fill="white" stroke="#DCE2E2"/><text x="159" y="806" class="small bold">Connected</text><rect x="260" y="776" width="110" height="48" rx="7" fill="white" stroke="#DCE2E2"/><text x="282" y="806" class="small bold">More ···</text></svg>