<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-labelledby="t d"><title id="t">Desktop Light Research workspace concept</title><desc id="d">Static product design concept for review; all prospect data is fictional.</desc><style>text{font-family:Inter,Arial,sans-serif;fill:#17242C}.muted{fill:#68757C}.white{fill:#fff}.tiny{font-size:11px}.small{font-size:13px}.body{font-size:14px}.label{font-size:12px;font-weight:700;letter-spacing:.8px}.h1{font-size:25px;font-weight:750}.h2{font-size:17px;font-weight:700}.num{font-size:22px;font-weight:750}.serif{font-family:Georgia,serif}.bold{font-weight:700}</style><rect width="100%" height="100%" fill="#F4F3EF"/><rect width="1440" height="68" fill="#17242C"/><circle cx="28" cy="34" r="13" fill="#00A6A6"/><path d="M21 34h14M28 27v14" stroke="white" stroke-width="2"/><text x="52" y="31" class="white h2">Light Research</text><text x="52" y="49" class="tiny" fill="#B9C5C8">4 prospects · smallest decision-changing checks</text><rect x="1130" y="17" width="170" height="34" rx="6" fill="#263740"/><text x="1150" y="39" class="small" fill="#B9C5C8">⌕  Search prospects</text><rect x="1314" y="17" width="102" height="34" rx="6" fill="#00A6A6"/><text x="1333" y="39" class="white small bold">↻ Refresh</text><rect x="24" y="92" width="420" height="736" rx="10" fill="white"/><text x="48" y="128" class="h2">Blocked queue</text><text x="48" y="150" class="small muted">Ordered by likely decision impact</text><rect x="48" y="178" width="372" height="126" rx="8" fill="#FFF4E7"/><rect x="48" y="178" width="4" height="126" rx="2" fill="#B56B13"/><text x="66" y="204" class="label" fill="#B56B13">1 · LIGHT RESEARCH</text><text x="66" y="231" class="body bold">Avery Morgan</text><text x="66" y="253" class="small muted">Clinical Education Network</text><text x="66" y="280" class="tiny">Does the program serve external clinicians?</text><rect x="48" y="318" width="372" height="102" rx="8" fill="#FAFBFA"/><text x="66" y="346" class="label muted">2 · SOURCE CONFLICT</text><text x="66" y="373" class="body bold">Sam Rivera</text><text x="66" y="397" class="tiny" fill="#B84D44">Current role differs across two sources</text><rect x="464" y="92" width="952" height="736" rx="10" fill="white"/><text x="492" y="130" class="label" fill="#B56B13">BLOCKING QUESTION</text><text x="492" y="172" class="h1">Does the program serve external clinicians?</text><text x="492" y="206" class="serif h2">This determines whether the account fits an extended-enterprise</text><text x="492" y="230" class="serif h2">learning motion or an internal-only use case.</text><rect x="492" y="264" width="896" height="76" rx="8" fill="#F7F9F8"/><text x="510" y="290" class="label muted">SMALLEST NEXT CHECK</text><text x="510" y="318" class="body bold">Review the public program eligibility and registration pages.</text><text x="492" y="382" class="h2">Research plan</text><text x="492" y="416" class="label muted">DECISION IMPACT</text><text x="668" y="416" class="small">Fit · Evidence</text><text x="492" y="450" class="label muted">DEPTH / BUDGET</text><text x="668" y="450" class="small">Qualification · 5 sources / 10 pages</text><text x="492" y="484" class="label muted">STOP WHEN</text><text x="668" y="484" class="small">Audience is attributable or remains explicitly unknown</text><text x="492" y="518" class="label muted">PERMITTED</text><text x="668" y="518" class="small">Public HTTP(S) pages only · no restricted automation</text><text x="492" y="568" class="h2">Sources checked</text><rect x="492" y="590" width="896" height="58" rx="8" fill="#FAFBFA"/><text x="510" y="616" class="small bold">Program overview</text><text x="510" y="637" class="tiny muted">Fresh · no audience statement found · Jul 29, 2026</text><rect x="492" y="664" width="896" height="58" rx="8" fill="#FAFBFA"/><text x="510" y="690" class="small bold">Course catalog</text><text x="510" y="711" class="tiny muted">Fresh · registration requires manual review · Jul 29, 2026</text><rect x="492" y="752" width="210" height="48" rx="7" fill="#B56B13"/><text x="536" y="782" class="white small bold">Run next check</text><text x="724" y="782" class="tiny muted">Proposed status changes always require review.</text></svg>